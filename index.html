<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resident Schedule</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#20242a;--muted:#68707a;--line:#dfe3e8;--accent:#4f6f9f;--b19:#d9e9ff;--b20:#dff3df;--b21:#fff0c9;--b22:#f7dded;--b23:#e2dcfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1450px;margin:auto;padding:12px}h1{font-size:22px;margin:0}.top,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{margin-bottom:10px}.spacer{flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:white;cursor:pointer}button.secondary{background:#e9edf2;color:#29313a}input,select{border:1px solid #ccd2d9;border-radius:8px;padding:8px;background:#fff;color:#20242a}.month{font-weight:700}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:separate;border-spacing:0;min-width:900px;width:max-content}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;background:#fff}thead th{position:sticky;top:0;z-index:4;background:#f0f2f5;min-width:135px;text-align:center;font-size:12px}thead th:first-child{left:0;z-index:6;min-width:115px}td:first-child{position:sticky;left:0;z-index:3;background:#fff;min-width:115px}.assign{width:120px;min-width:120px;font-size:13px}.assign.res19{background:var(--b19)}.assign.res20{background:var(--b20)}.assign.res21{background:var(--b21)}.assign.res22{background:var(--b22)}.assign.res23{background:var(--b23)}.duty small{display:block;color:var(--muted);font-weight:500}.login{max-width:420px;margin:10vh auto}.login h1{margin-bottom:15px}.login input{width:100%;margin:5px 0}.msg{font-size:13px;color:#68707a;min-height:18px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{background:white;border-radius:12px;padding:16px;width:100%;max-width:650px;max-height:90vh;overflow:auto}.row{display:flex;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.row>*:first-child{flex:1}.pill{padding:3px 7px;border-radius:99px;font-size:11px;font-weight:700}.p19{background:var(--b19)}.p20{background:var(--b20)}.p21{background:var(--b21)}.p22{background:var(--b22)}.p23{background:var(--b23)}.hidden{display:none}.notice{font-size:13px;color:#4d7b62;min-height:18px}
</style>
</head>
<body>
<div id="login" class="login card">
<h1>📅 Resident Schedule</h1>
<p class="msg">Sign in to access the shared schedule.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">Sign in</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="app" class="app hidden">
<div class="top">
<h1>📅 Resident Monthly Schedule</h1>
<select id="month" class="month"></select>
<button onclick="newMonth()">＋ New month</button>
<button id="resBtn" class="secondary" onclick="residentsModal()">Residents</button>
<button id="dutyBtn" class="secondary" onclick="dutiesModal()">Duties</button>
<button id="usersBtn" class="secondary" onclick="usersModal()">Users</button>
<div class="spacer"></div><span id="role" class="msg"></span><button class="secondary" onclick="signOut()">Sign out</button>
</div>
<div class="card"><div class="toolbar"><button onclick="moveMonth(-1)">‹</button><button onclick="moveMonth(1)">›</button><button class="secondary" onclick="statsModal()">📊 Statistics</button><div class="spacer"></div><span class="msg">Dates are on the left; duties are across the top.</span></div></div>
<div id="commandCard" class="card">
<b>Quick command</b><div class="toolbar" style="margin-top:7px"><input id="command" style="flex:1;min-width:250px" placeholder="Hossam has Smouha cath lab each Sunday"><button onclick="command()">Apply</button></div>
<div class="msg">Pattern: [Resident] has [Duty] each [weekday]</div><div id="notice" class="notice"></div>
</div>
<div id="schedule"></div>
<div class="card"><b>Monthly morning-duty totals</b><div id="miniStats" style="margin-top:8px"></div></div>
</div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ncvampqtqrfziwoqvxjq.supabase.co";
const SUPABASE_KEY="sb_publishable_eLC90HKROH3jwMKvQ-kSbw_y5yraBar";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BATCHES=["2019","2020","2021","2022","2023"], DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let user=null,role="viewer",residents=[],duties=[],months=[],assignments=[],currentKey=new Date().toISOString().slice(0,7);

const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function monthLabel(k){let [y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleString(undefined,{month:"long",year:"numeric"})}
function daysInMonth(k){let [y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()}
function dayName(k,d){let [y,m]=k.split("-").map(Number);return DAYS[new Date(y,m-1,d).getDay()]}
function canEdit(){return role==="admin"||role==="editor"} function isAdmin(){return role==="admin"}

async function signIn(){let e=$("email").value.trim(),p=$("password").value;let {error}=await sb.auth.signInWithPassword({email:e,password:p});$("loginMsg").textContent=error?error.message:"";}
async function signOut(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;if(user){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}else{$("app").classList.add("hidden");$("login").classList.remove("hidden")}});

async function load(){
 let r=await sb.from("schedule_user_roles").select("role").eq("user_id",user.id).maybeSingle(); role=r.data?.role||"viewer";$("role").textContent=`${role[0].toUpperCase()+role.slice(1)} · ${user.email}`;
 $("resBtn").style.display=isAdmin()?"":"none";$("dutyBtn").style.display=isAdmin()?"":"none";$("usersBtn").style.display=isAdmin()?"":"none";
 let a=await Promise.all([sb.from("schedule_residents").select("*").order("name"),sb.from("schedule_duties").select("*").order("created_at"),sb.from("schedule_months").select("*").order("month_key")]);
 residents=a[0].data||[];duties=a[1].data||[];months=a[2].data||[];
 if(!months.some(m=>m.month_key===currentKey) && canEdit()){await sb.from("schedule_months").insert({month_key:currentKey});let x=await sb.from("schedule_months").select("*").order("month_key");months=x.data||[]}
 if(!months.some(m=>m.month_key===currentKey)) currentKey=months[months.length-1]?.month_key||currentKey;
 $("month").innerHTML=months.map(m=>`<option value="${m.month_key}">${monthLabel(m.month_key)}</option>`).join("");$("month").value=currentKey;$("month").onchange=()=>{currentKey=$("month").value;render()};
 await loadAssignments();render();
}
async function loadAssignments(){let m=months.find(x=>x.month_key===currentKey);if(!m){assignments=[];return}let x=await sb.from("schedule_assignments").select("*").eq("month_id",m.id);assignments=x.data||[]}
function getMonthId(){return months.find(x=>x.month_key===currentKey)?.id}
function occupied(day){return assignments.filter(a=>a.day===day&&a.resident_id).map(a=>a.resident_id)}
function findAssign(did,slot,day){return assignments.find(a=>a.duty_id===did&&a.slot===slot&&a.day===day)}
async function setAssign(did,slot,day,rid){
 if(!canEdit())return;
 let old=findAssign(did,slot,day), taken=occupied(day).filter(x=>x!==old?.resident_id);
 if(rid && taken.includes(rid)){alert("That resident is already assigned on this date.");render();return}
 if(old){let x=await sb.from("schedule_assignments").update({resident_id:rid||null}).eq("id",old.id);if(x.error)alert(x.error.message)}
 else if(rid){let x=await sb.from("schedule_assignments").insert({month_id:getMonthId(),duty_id:did,slot,day,resident_id:rid});if(x.error)alert(x.error.message)}
 await loadAssignments();render();
}
function render(){
 let wrap=document.createElement("div");wrap.className="table-wrap";let t=document.createElement("table"),tr=document.createElement("tr");
 tr.innerHTML="<th>Date</th>"+duties.map(d=>`<th><div class="duty">${esc(d.name)}<small>${d.duty_type==="morning"?"Morning":"24 hour"} · ${d.slots} resident${d.slots>1?"s":""}</small></div></th>`).join("");
 let thead=document.createElement("thead");thead.appendChild(tr);t.appendChild(thead);let tb=document.createElement("tbody");
 for(let day=1;day<=daysInMonth(currentKey);day++){
  let row=document.createElement("tr");row.innerHTML=`<td><b>${day}</b><small style="display:block;color:#68707a">${dayName(currentKey,day)}</small></td>`;
  duties.forEach(d=>{
   let cell=document.createElement("td");
   for(let s=0;s<d.slots;s++){
    let sel=document.createElement("select");sel.className="assign";sel.disabled=!canEdit();let o=document.createElement("option");o.value="";o.textContent="—";sel.appendChild(o);
    let a=findAssign(d.id,s,day), used=occupied(day).filter(id=>id!==a?.resident_id);
    residents.filter(r=>!used.includes(r.id)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{let op=document.createElement("option");op.value=r.id;op.textContent=`${r.name} (${r.batch})`;sel.appendChild(op)});
    sel.value=a?.resident_id||"";let rr=residents.find(r=>r.id===sel.value);if(rr)sel.classList.add("res"+rr.batch);
    sel.onchange=()=>setAssign(d.id,s,day,sel.value);cell.appendChild(sel);
   }row.appendChild(cell)
  });tb.appendChild(row)
 }
 t.appendChild(tb);wrap.appendChild(t);$("schedule").innerHTML="";$("schedule").appendChild(wrap);renderStats($("miniStats"));
}
function renderStats(root){
 let rows=residents.map(r=>{let as=assignments.filter(a=>a.resident_id===r.id&&duties.find(d=>d.id===a.duty_id)?.duty_type==="morning"),by={};as.forEach(a=>{let d=duties.find(x=>x.id===a.duty_id);if(d)by[d.name]=(by[d.name]||0)+1});return `<tr><td><span class="pill p${r.batch}">${r.batch}</span> ${esc(r.name)}</td><td>${as.length}</td><td>${Object.entries(by).map(([k,v])=>`${esc(k)}: ${v}`).join(" · ")||"—"}</td></tr>`}).join("");
 root.innerHTML=`<table style="width:100%;border-collapse:collapse"><tr><th>Resident</th><th>Total morning</th><th>By duty</th></tr>${rows}</table>`;
}
async function command(){
 let m=$("command").value.trim().match(/^(.+?)\s+has\s+(.+?)\s+each\s+(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)$/i);
 if(!m){$("notice").textContent="Use: Hossam has Smouha cath lab each Sunday";return}
 let r=residents.find(x=>x.name.toLowerCase()===m[1].trim().toLowerCase()),d=duties.find(x=>x.name.toLowerCase()===m[2].trim().toLowerCase()),wd=DAYS.findIndex(x=>x.toLowerCase()===m[3].toLowerCase());
 if(!r||!d){$("notice").textContent=!r?"Resident not found.": "Duty not found.";return}
 let changed=0,skip=0;
 for(let day=1;day<=daysInMonth(currentKey);day++){let [y,mo]=currentKey.split("-").map(Number);if(new Date(y,mo-1,day).getDay()!==wd)continue;let slot=-1;for(let s=0;s<d.slots;s++){let a=findAssign(d.id,s,day),taken=occupied(day).filter(id=>id!==a?.resident_id);if(!taken.includes(r.id)){slot=s;break}}if(slot<0){skip++;continue}await setAssign(d.id,slot,day,r.id);changed++}
 $("notice").textContent=`Applied ${changed} time(s)${skip?`; ${skip} conflict(s) skipped.`:"."}`;
}
async function newMonth(){if(!canEdit())return;let k=prompt("Enter month as YYYY-MM",currentKey);if(!k||!/^\d{4}-\d{2}$/.test(k))return;let x=await sb.from("schedule_months").insert({month_key:k});if(x.error&&!x.error.message.includes("duplicate"))alert(x.error.message);await load()}
async function moveMonth(delta){let [y,m]=currentKey.split("-").map(Number);let d=new Date(y,m-1+delta,1);let k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months.some(x=>x.month_key===k)&&canEdit()){await sb.from("schedule_months").insert({month_key:k})}currentKey=k;await load()}
function showModal(h){$("modalbox").innerHTML=h;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}

async function residentsModal(){
 let list=residents.map(r=>`<div class="row"><span class="pill p${r.batch}">${r.batch}</span><span>${esc(r.name)}</span><button onclick="deleteResident('${r.id}')">Delete</button></div>`).join("");
 showModal(`<h2>Residents</h2><div class="toolbar"><input id="rn" placeholder="Name"><select id="rb">${BATCHES.map(x=>`<option>${x}</option>`).join("")}</select><button onclick="addResident()">Add</button></div><div style="margin-top:8px">${list||"No residents yet."}</div><p><button class="secondary" onclick="closeModal()">Done</button></p>`)
}
async function addResident(){let name=$("rn").value.trim(),batch=$("rb").value;if(!name)return;let x=await sb.from("schedule_residents").insert({name,batch});if(x.error)alert(x.error.message);await load();residentsModal()}
async function deleteResident(id){if(!confirm("Delete resident and their assignments?"))return;await sb.from("schedule_residents").delete().eq("id",id);await load();residentsModal()}
async function dutiesModal(){
 let list=duties.map(d=>`<div class="row"><span><b>${esc(d.name)}</b> · ${d.duty_type==="morning"?"Morning":"24 hour"} · ${d.slots} slot(s)</span><button onclick="deleteDuty('${d.id}')">Delete</button></div>`).join("");
 showModal(`<h2>Duties / shifts</h2><div class="toolbar"><input id="dn" placeholder="Duty name"><select id="dt"><option value="morning">Morning</option><option value="24h">24 hour</option></select><input id="ds" type="number" min="1" value="1" style="width:80px"><button onclick="addDuty()">Add</button></div><div class="msg">The number of slots creates that many resident cells under the duty.</div><div style="margin-top:8px">${list||"No duties yet."}</div><p><button class="secondary" onclick="closeModal()">Done</button></p>`)
}
async function addDuty(){let name=$("dn").value.trim(),type=$("dt").value,slots=Math.max(1,+$("ds").value||1);if(!name)return;let x=await sb.from("schedule_duties").insert({name,duty_type:type,slots});if(x.error)alert(x.error.message);await load();dutiesModal()}
async function deleteDuty(id){if(!confirm("Delete this duty and its assignments?"))return;await sb.from("schedule_duties").delete().eq("id",id);await load();dutiesModal()}
async function statsModal(){showModal(`<h2>Statistics — ${monthLabel(currentKey)}</h2><div id="modalStats"></div><p><button class="secondary" onclick="closeModal()">Close</button></p>`);renderStats($("modalStats"))}
</script>
</body></html>
