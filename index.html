<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardiology Residents Schedule</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#26313b;--muted:#6c7782;--line:#dfe5ea;--accent:#5d7898;--morning:#eaf4f5;--shift:#f5edf8;--tab:#eef2f6;--b19:#dcecff;--b20:#e3f4e3;--b21:#fff1cc;--b22:#f7e1ee;--b23:#e8e2fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1500px;margin:auto;padding:14px}h1{font-size:23px;margin:0}.top,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{margin-bottom:10px}.spacer{flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #25364a0b}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#e9eef3;color:#2f3b45}button.danger{background:#a85f68}input,select{border:1px solid #ccd5dd;border-radius:9px;padding:8px;background:#fff;color:var(--ink)}.month{font-weight:700}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{background:var(--tab);color:#42515d;border:1px solid var(--line)}.tab.active{background:var(--accent);color:#fff}.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative}table{border-collapse:separate;border-spacing:0;min-width:max-content;width:max-content}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:#fff}thead th{position:sticky;top:0;z-index:10;background:#eef2f5;min-width:145px;text-align:center;font-size:12px}thead th:first-child{position:sticky;left:0;top:0;z-index:20;min-width:115px;background:#eef2f5}td:first-child{position:sticky;left:0;z-index:10;background:#fff;min-width:115px;font-weight:600}.morning-head{background:var(--morning)!important}.shift-head{background:var(--shift)!important}.assign{width:138px;min-width:138px;font-size:12px}.assign.res19{background:var(--b19)}.assign.res20{background:var(--b20)}.assign.res21{background:var(--b21)}.assign.res22{background:var(--b22)}.assign.res23{background:var(--b23)}.duty small{display:block;color:var(--muted);font-weight:500}.login{max-width:420px;margin:10vh auto}.login input{width:100%;margin:5px 0}.msg{font-size:13px;color:var(--muted);min-height:18px}.notice{font-size:13px;color:#4d7b62;min-height:18px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modalbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:720px;max-height:90vh;overflow:auto}.row{display:flex;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row>*:first-child{flex:1}.pill{padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.p19{background:var(--b19)}.p20{background:var(--b20)}.p21{background:var(--b21)}.p22{background:var(--b22)}.p23{background:var(--b23)}.hidden{display:none}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.stats-grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login card"><h1>📅 Cardiology Residents Schedule</h1><p class="msg">Sign in to access the shared schedule.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button><div id="loginMsg" class="msg"></div></div>
<div id="app" class="app hidden"><div class="top"><h1>📅 Residents Schedule</h1><select id="month" class="month"></select><button onclick="newMonth()">＋ New month</button><button id="resBtn" class="secondary" onclick="residentsModal()">Residents</button><button id="dutyBtn" class="secondary" onclick="dutiesModal()">Duties</button><button id="usersBtn" class="secondary" onclick="usersModal()">Users</button><div class="spacer"></div><span id="role" class="msg"></span><button class="secondary" onclick="signOut()">Sign out</button></div>
<div class="card"><div class="toolbar"><button onclick="moveMonth(-1)">‹</button><button onclick="moveMonth(1)">›</button><div class="spacer"></div><button class="secondary" onclick="statsModal()">📊 Statistics</button></div></div>
<div class="tabs"><button id="morningTab" class="tab active" onclick="setTab('morning')">🌅 Morning Duties</button><button id="shiftTab" class="tab" onclick="setTab('24h')">🌙 24-hour Shifts</button></div>
<div id="commandCard" class="card"><b>Quick command</b><div class="toolbar" style="margin-top:7px"><input id="command" style="flex:1;min-width:260px" placeholder="Hossam has Smouha cath lab each Sunday"><button onclick="command()">Apply</button></div><div class="msg">Example: [Resident] has [Duty] each [weekday]</div><div id="notice" class="notice"></div></div>
<div id="schedule"></div><div class="card"><b id="statsTitle">Morning-duty totals</b><div id="miniStats" style="margin-top:8px"></div></div></div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ncvampqtqrfziwoqvxjq.supabase.co",SUPABASE_KEY="sb_publishable_eLC90HKROH3jwMKvQ-kSbw_y5yraBar",sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BATCHES=["2019","2020","2021","2022","2023"],DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];let user=null,role="viewer",residents=[],duties=[],months=[],assignments=[],currentKey=new Date().toISOString().slice(0,7),activeTab="morning";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function monthLabel(k){let[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleString(undefined,{month:"long",year:"numeric"})}function daysInMonth(k){let[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()}function dayName(k,d){let[y,m]=k.split("-").map(Number);return DAYS[new Date(y,m-1,d).getDay()]}function canEdit(){return role==="admin"||role==="editor"}function isAdmin(){return role==="admin"}
async function signIn(){let e=$("email").value.trim(),p=$("password").value,{error}=await sb.auth.signInWithPassword({email:e,password:p});$("loginMsg").textContent=error?error.message:""}async function signOut(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(async(_,session)=>{user=session?.user||null;if(user){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}else{$("app").classList.add("hidden");$("login").classList.remove("hidden")}});
async function load(){let r=await sb.from("schedule_user_roles").select("role").eq("user_id",user.id).maybeSingle();role=r.data?.role||"viewer";$("role").textContent=`${role[0].toUpperCase()+role.slice(1)} · ${user.email}`;["resBtn","dutyBtn","usersBtn","commandCard"].forEach(id=>$(id).style.display=(id==="commandCard"?canEdit():isAdmin())?"":"none");let a=await Promise.all([sb.from("schedule_residents").select("*").order("batch").order("created_at"),sb.from("schedule_duties").select("*").order("created_at"),sb.from("schedule_months").select("*").order("month_key")]);residents=a[0].data||[];duties=a[1].data||[];months=a[2].data||[];if(!months.some(m=>m.month_key===currentKey)&&canEdit()){await sb.from("schedule_months").insert({month_key:currentKey});let x=await sb.from("schedule_months").select("*").order("month_key");months=x.data||[]}if(!months.some(m=>m.month_key===currentKey))currentKey=months[months.length-1]?.month_key||currentKey;$("month").innerHTML=months.map(m=>`<option value="${m.month_key}">${monthLabel(m.month_key)}</option>`).join("");$("month").value=currentKey;$("month").onchange=async()=>{currentKey=$("month").value;await loadAssignments();render()};await loadAssignments();render()}
async function loadAssignments(){let m=months.find(x=>x.month_key===currentKey);if(!m){assignments=[];return}let x=await sb.from("schedule_assignments").select("*").eq("month_id",m.id);assignments=x.data||[]}function getMonthId(){return months.find(x=>x.month_key===currentKey)?.id}function occupied(day){return assignments.filter(a=>a.day===day&&a.resident_id).map(a=>a.resident_id)}function findAssign(did,slot,day){return assignments.find(a=>a.duty_id===did&&a.slot===slot&&a.day===day)}
async function setAssign(did,slot,day,rid){if(!canEdit())return;let old=findAssign(did,slot,day),taken=occupied(day).filter(x=>x!==old?.resident_id);if(rid&&taken.includes(rid)){alert("That resident is already assigned somewhere else on this date.");render();return}if(old){let x=await sb.from("schedule_assignments").update({resident_id:rid||null}).eq("id",old.id);if(x.error)alert(x.error.message)}else if(rid){let x=await sb.from("schedule_assignments").insert({month_id:getMonthId(),duty_id:did,slot,day,resident_id:rid});if(x.error)alert(x.error.message)}await loadAssignments();render()}
function setTab(t){activeTab=t;$("morningTab").classList.toggle("active",t==="morning");$("shiftTab").classList.toggle("active",t==="24h");render()}
function render(){let shown=duties.filter(d=>d.duty_type===activeTab);let wrap=document.createElement("div");wrap.className="table-wrap";let t=document.createElement("table"),tr=document.createElement("tr");tr.innerHTML="<th>Date</th>"+shown.map(d=>`<th class="${activeTab==="morning"?"morning-head":"shift-head"}"><div class="duty">${esc(d.name)}<small>${activeTab==="morning"?"Morning":"24 hour"} · up to ${d.slots}</small></div></th>`).join("");let thead=document.createElement("thead");thead.appendChild(tr);t.appendChild(thead);let tb=document.createElement("tbody");for(let day=1;day<=daysInMonth(currentKey);day++){let row=document.createElement("tr");row.innerHTML=`<td><b>${day}</b><small style="display:block;color:#68707a">${dayName(currentKey,day)}</small></td>`;shown.forEach(d=>{let cell=document.createElement("td");for(let s=0;s<d.slots;s++){let sel=document.createElement("select");sel.className="assign";sel.disabled=!canEdit();let op=document.createElement("option");op.value="";op.textContent="— empty —";sel.appendChild(op);let a=findAssign(d.id,s,day),used=occupied(day).filter(id=>id!==a?.resident_id);for(const batch of BATCHES){let group=document.createElement("optgroup");group.label=batch;residents.filter(r=>r.batch===batch&&!used.includes(r.id)).forEach(r=>{let o=document.createElement("option");o.value=r.id;o.textContent=r.name;group.appendChild(o)});if(group.children.length)sel.appendChild(group)}sel.value=a?.resident_id||"";let rr=residents.find(r=>r.id===sel.value);if(rr)sel.classList.add("res"+rr.batch);sel.onchange=()=>setAssign(d.id,s,day,sel.value);cell.appendChild(sel)}row.appendChild(cell)}tb.appendChild(row)}t.appendChild(tb);wrap.appendChild(t);$("schedule").innerHTML="";$("schedule").appendChild(wrap);$("statsTitle").textContent=activeTab==="morning"?"Morning-duty totals":"24-hour-shift totals";renderMiniStats()}
function morningStats(r){let as=assignments.filter(a=>a.resident_id===r.id&&duties.find(d=>d.id===a.duty_id)?.duty_type==="morning"),by={};as.forEach(a=>{let d=duties.find(x=>x.id===a.duty_id);if(d)by[d.name]=(by[d.name]||0)+1});return{n:as.length,by}}function shiftStats(r){return assignments.filter(a=>a.resident_id===r.id&&duties.find(d=>d.id===a.duty_id)?.duty_type==="24h").length}
function renderMiniStats(){let rows=residents.map(r=>{let n=activeTab==="morning"?morningStats(r).n:shiftStats(r);return `<tr><td><span class="pill p${r.batch}">${r.batch}</span> ${esc(r.name)}</td><td>${n}</td></tr>`}).join("");$("miniStats").innerHTML=`<table style="width:100%;border-collapse:collapse"><tr><th>Resident</th><th>${activeTab==="morning"?"Total morning duties":"Total 24-hour shifts"}</th></tr>${rows}</table>`}
async function command(){let m=$("command").value.trim().match(/^(.+?)\s+has\s+(.+?)\s+each\s+(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)$/i);if(!m){$("notice").textContent="Use: Hossam has Smouha cath lab each Sunday";return}let r=residents.find(x=>x.name.toLowerCase()===m[1].trim().toLowerCase()),d=duties.find(x=>x.name.toLowerCase()===m[2].trim().toLowerCase()&&x.duty_type===activeTab),wd=DAYS.findIndex(x=>x.toLowerCase()===m[3].toLowerCase());if(!r||!d){$("notice").textContent=!r?"Resident not found.":"Duty not found in this tab.";return}let changed=0,skip=0;for(let day=1;day<=daysInMonth(currentKey);day++){let[y,mo]=currentKey.split("-").map(Number);if(new Date(y,mo-1,day).getDay()!==wd)continue;let slot=-1;for(let s=0;s<d.slots;s++){let a=findAssign(d.id,s,day),taken=occupied(day).filter(id=>id!==a?.resident_id);if(!taken.includes(r.id)){slot=s;break}}if(slot<0){skip++;continue}await setAssign(d.id,slot,day,r.id);changed++}$("notice").textContent=`Applied ${changed} time(s)${skip?`; ${skip} conflict(s) skipped.`:"."}`}
async function newMonth(){if(!canEdit())return;let k=prompt("Enter month as YYYY-MM",currentKey);if(!k||!/^[0-9]{4}-[0-9]{2}$/.test(k))return;let x=await sb.from("schedule_months").insert({month_key:k});if(x.error&&!x.error.message.includes("duplicate"))alert(x.error.message);await load()}async function moveMonth(delta){let[y,m]=currentKey.split("-").map(Number),d=new Date(y,m-1+delta,1),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months.some(x=>x.month_key===k)&&canEdit())await sb.from("schedule_months").insert({month_key:k});currentKey=k;await load()}
function showModal(h){$("modalbox").innerHTML=h;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
async function residentsModal(){let list=residents.map(r=>`<div class="row"><span><span class="pill p${r.batch}">${r.batch}</span> ${esc(r.name)}</span><button class="danger" onclick="deleteResident('${r.id}')">Delete</button></div>`).join("");showModal(`<h2>Residents</h2><div class="toolbar"><input id="rn" placeholder="Name"><select id="rb">${BATCHES.map(x=>`<option>${x}</option>`).join("")}</select><button onclick="addResident()">Add</button></div><div>${list||"No residents yet."}</div><p><button class="secondary" onclick="closeModal()">Done</button></p>`)}async function addResident(){let name=$("rn").value.trim(),batch=$("rb").value;if(!name)return;let x=await sb.from("schedule_residents").insert({name,batch});if(x.error)alert(x.error.message);await load();residentsModal()}async function deleteResident(id){if(!confirm("Delete resident and their assignments?"))return;await sb.from("schedule_residents").delete().eq("id",id);await load();residentsModal()}
async function dutiesModal(){let list=duties.map(d=>`<div class="row"><span><b>${esc(d.name)}</b> · ${d.duty_type==="morning"?"Morning":"24 hour"} · ${d.slots} slot(s)</span><button class="danger" onclick="deleteDuty('${d.id}')">Delete</button></div>`).join("");showModal(`<h2>Duties / shifts</h2><div class="toolbar"><input id="dn" placeholder="Duty name"><select id="dt"><option value="morning">Morning</option><option value="24h">24 hour</option></select><input id="ds" type="number" min="1" value="1" style="width:80px"><button onclick="addDuty()">Add</button></div><p class="msg">Slots are a maximum; every slot may be left empty.</p><div>${list}</div><p><button class="secondary" onclick="closeModal()">Done</button></p>`)}async function addDuty(){let name=$("dn").value.trim(),type=$("dt").value,slots=Math.max(1,+$("ds").value||1);if(!name)return;let x=await sb.from("schedule_duties").insert({name,duty_type:type,slots});if(x.error)alert(x.error.message);await load();dutiesModal()}async function deleteDuty(id){if(!confirm("Delete this duty and its assignments?"))return;await sb.from("schedule_duties").delete().eq("id",id);await load();dutiesModal()}
async function statsModal(){let rows=residents.map(r=>{let ms=morningStats(r),sh=shiftStats(r);return `<tr><td><span class="pill p${r.batch}">${r.batch}</span> ${esc(r.name)}</td><td>${ms.n}</td><td>${Object.entries(ms.by).map(([k,v])=>`${esc(k)}: ${v}`).join(" · ")||"—"}</td><td>${sh}</td></tr>`}).join("");showModal(`<h2>Statistics — ${monthLabel(currentKey)}</h2><table style="width:100%;border-collapse:collapse"><tr><th>Resident</th><th>Morning total</th><th>Morning breakdown</th><th>24h total</th></tr>${rows}</table><p><button class="secondary" onclick="closeModal()">Close</button></p>`)}
async function usersModal(){let q=await sb.rpc("admin_list_schedule_users");if(q.error){alert(q.error.message);return}let list=(q.data||[]).map(u=>`<div class="row"><span><b>${esc(u.email)}</b></span><select id="role_${u.user_id}"><option value="viewer" ${u.role==="viewer"?"selected":""}>Viewer</option><option value="editor" ${u.role==="editor"?"selected":""}>Editor</option><option value="admin" ${u.role==="admin"?"selected":""}>Admin</option></select><button onclick="changeRole('${esc(u.email)}','${u.user_id}')">Save</button>${u.user_id!==user.id?`<button class="danger" onclick="removeAccess('${esc(u.email)}')">Remove</button>`:""}</div>`).join("");showModal(`<h2>User access</h2><p class="msg">The person must already have a Supabase account.</p><div class="toolbar"><input id="newUserEmail" type="email" placeholder="Existing account email" style="flex:1"><select id="newUserRole"><option value="viewer">Viewer</option><option value="editor">Editor</option></select><button onclick="addUserRole()">Add / set role</button></div><div>${list||"No users found."}</div><p><button class="secondary" onclick="closeModal()">Done</button></p>`)}async function addUserRole(){let email=$("newUserEmail").value.trim(),r=$("newUserRole").value;if(!email)return;let x=await sb.rpc("admin_set_schedule_role",{p_email:email,p_role:r});if(x.error)alert(x.error.message);else usersModal()}async function changeRole(email,uid){let r=$("role_"+uid).value,x=await sb.rpc("admin_set_schedule_role",{p_email:email,p_role:r});if(x.error)alert(x.error.message);else usersModal()}async function removeAccess(email){if(!confirm("Remove this person's schedule access?"))return;let x=await sb.rpc("admin_remove_schedule_access",{p_email:email});if(x.error)alert(x.error.message);else usersModal()}
</script></body></html>
